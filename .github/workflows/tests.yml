name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.15.0"
      - name: Install Neovim for editor installer checks
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          printf '%s  %s\n' 'bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875' "$RUNNER_TEMP/nvim.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.txt
      - run: rustup update stable --no-self-update
      - run: cargo +stable test --release --locked --manifest-path native/Cargo.toml
