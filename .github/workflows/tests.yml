name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    name: fresh install and core checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nvim: nvim-linux-x86_64
            nvim_sha: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
            uv: uv-x86_64-unknown-linux-gnu
            uv_sha: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
            tree: tree-sitter-linux-x64
            tree_sha: 477ef03e7422f3579187859db7d5407ac345c854f9e2e6c4534d2305dac39a35
          - os: macos-15
            nvim: nvim-macos-arm64
            nvim_sha: 65fb000099e47ca1b762584c484cc833f40e30851a0ec450d4174e16317c1f9b
            uv: uv-aarch64-apple-darwin
            uv_sha: cfe454573412ff7380d15fc7dae5997ab53ffce72fce0a78e91ddbc84001acd2
            tree: tree-sitter-macos-arm64
            tree_sha: 821a387182db59a1942a90a1fbd8f9756d9926e2c265f5c7b9a23c523114134a
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install checksum-pinned official tools
        env:
          NVIM_ASSET: ${{ matrix.nvim }}
          NVIM_SHA: ${{ matrix.nvim_sha }}
          UV_ASSET: ${{ matrix.uv }}
          UV_SHA: ${{ matrix.uv_sha }}
          TREE_ASSET: ${{ matrix.tree }}
          TREE_SHA: ${{ matrix.tree_sha }}
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/neovim/neovim/releases/download/v0.12.5/$NVIM_ASSET.tar.gz" -o "$RUNNER_TEMP/nvim.tar.gz"
          printf '%s  %s\n' "$NVIM_SHA" "$RUNNER_TEMP/nvim.tar.gz" | shasum -a 256 --check
          if [[ $RUNNER_OS == macOS ]]; then xattr -c "$RUNNER_TEMP/nvim.tar.gz"; fi
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$NVIM_ASSET/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/astral-sh/uv/releases/download/0.13.1/$UV_ASSET.tar.gz" -o "$RUNNER_TEMP/uv.tar.gz"
          printf '%s  %s\n' "$UV_SHA" "$RUNNER_TEMP/uv.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$UV_ASSET" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ipynb-bin"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.10/$TREE_ASSET.gz" -o "$RUNNER_TEMP/tree-sitter.gz"
          printf '%s  %s\n' "$TREE_SHA" "$RUNNER_TEMP/tree-sitter.gz" | shasum -a 256 --check
          gzip -dc "$RUNNER_TEMP/tree-sitter.gz" > "$RUNNER_TEMP/ipynb-bin/tree-sitter"
          chmod +x "$RUNNER_TEMP/ipynb-bin/tree-sitter"
          echo "$RUNNER_TEMP/ipynb-bin" >> "$GITHUB_PATH"
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - name: Install system build prerequisites
        run: |
          if [[ $RUNNER_OS == macOS ]]; then
            brew install pkgconf
          else
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config
          fi
      - name: Fresh headless IpynbInstall (images disabled)
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/ipynb/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/ipynb/data"
          export XDG_STATE_HOME="$RUNNER_TEMP/ipynb/state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/ipynb/cache"
          test ! -e "$XDG_DATA_HOME"
          git clone --filter=blob:none --branch=stable https://github.com/folke/lazy.nvim.git "$XDG_DATA_HOME/nvim/lazy/lazy.nvim"
          cat > "$RUNNER_TEMP/ipynb-install.lua" <<'LUA'
          local ok, err = xpcall(function()
            vim.opt.loadplugins = true
            local plugins = vim.fn.stdpath('data') .. '/lazy'
            vim.opt.rtp:prepend(plugins .. '/lazy.nvim')
            local specs = dofile(vim.env.GITHUB_WORKSPACE .. '/lazy.lua')
            specs[1].dir = vim.env.GITHUB_WORKSPACE
            specs[1].build = false
            specs[1].opts = { images = false }
            for _, dependency in ipairs(specs[1].dependencies) do dependency.build = false end
            require('lazy').setup({
              spec = specs, root = plugins,
              lockfile = vim.fn.stdpath('state') .. '/lazy-lock.json',
              checker = { enabled = false }, change_detection = { enabled = false },
              rocks = { enabled = false }, pkg = { enabled = false },
            })
            local python = require('ipynb').options.python
            assert(vim.fn.executable(python) == 0, 'helper already exists')
            vim.cmd('IpynbInstall')
            local helper = vim.system({ python, '-c', 'import ipykernel, jupytext' }, { text = true }):wait()
            assert(helper.code == 0, helper.stderr)
            assert(vim.fn.executable(vim.env.GITHUB_WORKSPACE .. '/native/target/release/ipynb-engine') == 1)
          end, debug.traceback)
          if not ok then io.stderr:write(err .. '\n'); vim.cmd('cquit 1') end
          vim.cmd('qa!')
          LUA
          nvim --headless -u "$RUNNER_TEMP/ipynb-install.lua"
          test -x "$XDG_DATA_HOME/nvim/ipynb.nvim/venv/bin/python"
          test -x "$GITHUB_WORKSPACE/native/target/release/ipynb-engine"
          echo "IPYNB_TEST_PYTHON=$XDG_DATA_HOME/nvim/ipynb.nvim/venv/bin/python" >> "$GITHUB_ENV"
      - run: cargo +stable test --release --locked --manifest-path native/Cargo.toml
