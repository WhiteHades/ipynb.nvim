[package]
name = "ipynb-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
hmac = "0.12"
md5 = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zmq = "0.10"

[profile.release]
lto = "thin"
strip = true
